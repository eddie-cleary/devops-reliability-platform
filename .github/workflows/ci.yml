name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pytest httpx

      - name: Run test suite
        run: |
          python -m pytest -v tests
  
  build-push:
    needs: tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS ECR credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push service image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f service/Dockerfile -t $ECR_REGISTRY/reliability-service:$IMAGE_TAG .
          docker push $ECR_REGISTRY/reliability-service:$IMAGE_TAG

      - name: Build, tag, and push monitor image
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f monitor/Dockerfile -t $ECR_REGISTRY/reliability-monitor:$IMAGE_TAG .
          docker push $ECR_REGISTRY/reliability-monitor:$IMAGE_TAG
  
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: dev
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS ECS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition reliability-platform \
            --query taskDefinition > task-definition.json
      
      - name: Render service image into task definition
        id: render-service
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: reliability-service
          image: ${{ needs.build-push.outputs.registry }}/reliability-service:${{ github.sha }}
      
      - name: Render monitor image into task definition
        id: render-monitor
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-service.outputs.task-definition }}
          container-name: reliability-monitor
          image: ${{ needs.build-push.outputs.registry }}/reliability-monitor:${{ github.sha }}