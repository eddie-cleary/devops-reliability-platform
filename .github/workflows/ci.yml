name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pytest httpx

      - name: Run test suite
        run: |
          python -m pytest -v tests

      - name: Build demo service image
        run: docker build -f service/Dockerfile -t reliability-demo-service .

      - name: Build monitor image
        run: docker build -f monitor/Dockerfile -t reliability-monitor .