name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pytest httpx

      - name: Run test suite
        run: |
          python -m pytest -v tests

      - name: Build demo service image
        run: docker build -f service/Dockerfile -t reliability-demo-service .

      - name: Build monitor image
        run: docker build -f monitor/Dockerfile -t reliability-monitor .

      - name: Debug GitHub OIDC claims
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python -c \
            'import json,sys; print(json.load(sys.stdin)["value"])')

          TOKEN="$TOKEN" python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ["iss", "aud", "sub", "repository", "ref", "event_name"]:
              print(f"{key}: {claims.get(key)}")
          PY
        
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push service image
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f service/Dockerfile -t $ECR_REGISTRY/reliability-service:$IMAGE_TAG .
          docker push $ECR_REGISTRY/reliability-service:$IMAGE_TAG

      - name: Build, tag, and push monitor image
        if: github.ref == 'refs/heads/main'
        env: 
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f monitor/Dockerfile -t $ECR_REGISTRY/reliability-monitor:$IMAGE_TAG .
          docker push $ECR_REGISTRY/reliability-monitor:$IMAGE_TAG